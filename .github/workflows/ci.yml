name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: go fix (precisa estar em dia)
        run: go fix -diff ./...
      - name: testes
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o bin/ .

  # Confere de verdade o download do whisper.cpp no Windows (hash + extração).
  windows-whisper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: setup baixa o whisper e o modelo tiny
        shell: pwsh
        env:
          YT_TRANSCRIPT_HOME: ${{ runner.temp }}\yt
        run: |
          go run . setup -model tiny   # pode reclamar de yt-dlp/ffmpeg; o que importa é o whisper
          & "$env:YT_TRANSCRIPT_HOME\whisper\whisper-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
